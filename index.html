<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qual carro? — metrô de São Paulo</title>
    <meta
      name="description"
      content="Em qual carro do metrô de São Paulo entrar para descer na escada ou na integração."
    />
    <meta name="theme-color" content="#241f1b" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="shell">
      <div class="stripe" aria-hidden="true"></div>
      <header class="mast">
        <h1>Qual carro?</h1>
        <p>Metrô de São Paulo. Entra no carro certo pra não atravessar a plataforma inteira.</p>
      </header>

      <main>
        <div class="field" id="dest-field">
          <label class="lbl" for="dest-input">Onde você desce</label>
          <input
            id="dest-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="Sé, Luz, Paraíso…"
            role="combobox"
            aria-expanded="false"
            aria-controls="dest-list"
            aria-autocomplete="list"
          />
          <div id="dest-list" class="suggest-list" role="listbox" hidden></div>
        </div>

        <div class="field" id="origin-field">
          <label class="lbl" for="origin-input">De onde você sobe, se já souber</label>
          <input
            id="origin-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="opcional — monta a rota"
            role="combobox"
            aria-expanded="false"
            aria-controls="origin-list"
            aria-autocomplete="list"
          />
          <button type="button" id="clear-origin">limpar</button>
          <div id="origin-list" class="suggest-list" role="listbox" hidden></div>
        </div>

        <div id="ride" hidden></div>
        <div id="intent" hidden></div>
        <section id="result" aria-live="polite"></section>
      </main>

      <p class="foot">
        Posições de carro são estimadas a partir do tipo de plataforma (Wikipedia / Metrô SP). Ainda não
        houve visita de campo. Carro 1 é a frente do trem, no sentido que você escolheu.
      </p>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
